<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="shAdow 工作室：把灵感变成可用的东西。进入工具台，继续阅读创作，或玩一局。">
  <meta name="theme-color" content="#111315">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="shAdow 工作室">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>shAdow 工作室 · 频率站</title>
  <style>
    html,body{height:100%;margin:0;background:#111315;color:#f4f2e9;font:16px/1.6 system-ui,sans-serif}
    #startup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .message{max-width:480px}.brand{color:#d6ef36;font-size:28px;font-weight:700;margin-bottom:12px}
    p{color:#adb1a9}button,a{font:inherit;color:#d6ef36}button{min-height:48px;background:#1b1e20;border:1px solid #41484b;border-radius:8px;padding:10px 20px;cursor:pointer}
    :focus-visible{outline:2px solid #d6ef36;outline-offset:4px}
    .busy{margin:20px 0;color:#ffb23f}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite"><div class="message">
    <div class="brand">shAdow 工作室</div>
    <p>频率站 / Frequency Terminal</p>
    <div class="busy" id="loading">正在准备工具、故事与游戏…</div>
    <div id="failure" hidden><p>工作室暂时没有载入成功。请检查网络后重试。</p><button onclick="location.reload()">重新载入</button> <a href="https://github.com/shAdow-XJY-Manager">查看作品来源</a></div>
    <noscript><p>请启用 JavaScript 打开工作室。也可以直接查看 <a href="https://github.com/shAdow-XJY-Manager">作品与项目说明</a>。</p></noscript>
  </div></div>
  <script>
    const startup = document.getElementById('startup');
    function showFailure(){document.getElementById('loading').hidden=true;document.getElementById('failure').hidden=false;}
    window.addEventListener('flutter-first-frame',()=>startup.remove(),{once:true});
    window.addEventListener('error',event=>{if(event.target instanceof HTMLScriptElement)showFailure();},true);
    setTimeout(()=>{if(document.getElementById('startup'))showFailure();},30000);
  </script>
  <script src="flutter_bootstrap.js" async onerror="showFailure()"></script>
</body>
</html>
